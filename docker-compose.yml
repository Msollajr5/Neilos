version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neilos_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_NAME=Neilos Partner Portal
      - APP_URL=http://localhost:8080
      - APP_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=neilos_portal
      - DB_USER=neilos_user
      - DB_PASS=neilos_secret_pass
      - DB_CHARSET=utf8mb4
      - UPLOAD_MAX_SIZE=10485760
    volumes:
      - neilos_uploads:/var/www/html/public/uploads
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: neilos_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secret_pass
      - MYSQL_DATABASE=neilos_portal
      - MYSQL_USER=neilos_user
      - MYSQL_PASSWORD=neilos_secret_pass
    volumes:
      - neilos_db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  neilos_uploads:
  neilos_db_data:
